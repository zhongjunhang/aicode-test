<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇小游戏</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #e6f0ff, #f6f9ff);
    }

    .game-shell {
      width: min(92vw, 520px);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.3rem;
      text-align: center;
      color: #1f2937;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      font-size: 0.95rem;
      color: #111827;
    }

    #board {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #101827;
      border-radius: 10px;
      display: block;
    }

    .hint {
      margin: 10px 0 0;
      color: #374151;
      font-size: 0.9rem;
      line-height: 1.4;
      text-align: center;
    }

    button {
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1>🐍 贪吃蛇小游戏</h1>
    <div class="top-bar">
      <span>得分：<strong id="score">0</strong></span>
      <button id="restart" type="button">重新开始</button>
    </div>
    <canvas id="board" width="400" height="400"></canvas>
    <p class="hint">方向键 / WASD 控制移动。吃到红色食物会变长，撞墙或撞到自己则游戏结束。</p>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreNode = document.getElementById('score');
    const restartBtn = document.getElementById('restart');

    const gridSize = 20;
    const tileSize = canvas.width / gridSize;
    const speed = 120;

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let gameOver;
    let timerId;

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 },
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      scoreNode.textContent = '0';
      placeFood();
      clearInterval(timerId);
      timerId = setInterval(gameLoop, speed);
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * gridSize),
          y: Math.floor(Math.random() * gridSize),
        };
      } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
    }

    function setDirection(dx, dy) {
      if (dx === -direction.x && dy === -direction.y) {
        return;
      }
      nextDirection = { x: dx, y: dy };
    }

    function gameLoop() {
      if (gameOver) {
        return;
      }

      direction = nextDirection;
      const head = snake[0];
      const newHead = { x: head.x + direction.x, y: head.y + direction.y };

      const hitWall =
        newHead.x < 0 || newHead.y < 0 || newHead.x >= gridSize || newHead.y >= gridSize;
      const hitSelf = snake.some(segment => segment.x === newHead.x && segment.y === newHead.y);

      if (hitWall || hitSelf) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        scoreNode.textContent = String(score);
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < snake.length; i += 1) {
        const segment = snake[i];
        ctx.fillStyle = i === 0 ? '#10b981' : '#34d399';
        ctx.fillRect(segment.x * tileSize + 1, segment.y * tileSize + 1, tileSize - 2, tileSize - 2);
      }

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(
        food.x * tileSize + tileSize / 2,
        food.y * tileSize + tileSize / 2,
        tileSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '16px sans-serif';
        ctx.fillText('按“重新开始”再玩一次', canvas.width / 2, canvas.height / 2 + 24);
      }
    }

    function endGame() {
      gameOver = true;
      clearInterval(timerId);
      draw();
    }

    document.addEventListener('keydown', (event) => {
      switch (event.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          setDirection(0, -1);
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          setDirection(0, 1);
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          setDirection(-1, 0);
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          setDirection(1, 0);
          break;
      }
    });

    restartBtn.addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
